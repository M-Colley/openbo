[project]
name = "open-bo"
version = "0.1.0"
description = "Research and teaching library for OpenBO"
readme = "README.md"
authors = [
    { name = "yichiliao", email = "imetliao@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "botorch>=0.18.1",
    "gpytorch>=1.15.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "tqdm>=4.70.0",
    "websockets>=17.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openbo"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
